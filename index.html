  <script type="application/ld+json">

  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 18px;background:radial-gradient(ellipse at 50% 15%,#172233 0,transparent 52%),#090b10;color:#f5f7fb}
    .wrap{width:min(100%,650px);text-align:center}
    .logo{width:clamp(158px,48vw,270px);height:auto;display:block;margin:0 auto 15px;border-radius:24px}
    .eyebrow{font-size:11px;color:#8dddf4;font-weight:800;letter-spacing:2px;margin:8px 0 14px}
    h1{font-size:clamp(30px,7vw,46px);letter-spacing:-1px;margin:0 0 12px}
    .lead{color:#acb6c5;max-width:490px;margin:0 auto 26px;font-size:clamp(14px,3.5vw,17px);line-height:1.6}
    .cta{display:inline-flex;align-items:center;justify-content:center;min-height:51px;padding:12px 25px;background:#ff482f;color:#08090d;border-radius:13px;text-decoration:none;font-weight:900;font-size:15px;box-shadow:0 12px 35px rgba(255,49,29,.18)}
    .cta:hover{background:#ff684d;transform:translateY(-1px)}
    .cta:focus-visible{outline:3px solid #91f2ff;outline-offset:4px}
    .note{font-size:12px;color:#7d899a;margin:18px 0 0}
    footer{color:#687484;font-size:11px;margin-top:54px;text-align:center}
    @media(prefers-reduced-motion:no-preference){.cta{transition:.18s ease}}

<body>
  <main class="wrap">

  <footer>&copy; NEXORA STORE. Todos los derechos reservados.</footer>
